[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mostrar el output completo de fallos
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Marcadores personalizados
markers =
    unit: tests unitarios puros (sin BD ni HTTP)
    integration: tests de integración (requieren BD/HTTP)
    slow: tests lentos (>1s)

# Filtrar warnings ruidosos de dependencias
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
