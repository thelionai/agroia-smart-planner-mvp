# Alembic Configuration File
# Este archivo es leído por los comandos alembic (alembic upgrade, alembic revision, etc.)

[alembic]
# La URL se sobreescribe en env.py desde las variables de entorno .env
script_location = alembic

# Formato del nombre de los archivos de migración
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Ruta del timezone para las fechas de migraciones
timezone = UTC

# Número de versiones a mostrar en alembic history
version_path_separator = os

[post_write_hooks]
# Descomenta si quieres formatear automáticamente con black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

# Logging básico — compatible con la config de main.py
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
